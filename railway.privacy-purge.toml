# Config-as-code for the tis-privacy-purge cron service only.
# In Railway → tis-privacy-purge → Settings → Config-as-code, set the path to:
#   /railway.privacy-purge.toml
# Do not use the root railway.toml here — that file enables /health for WhatsApp.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m tis_agent privacy purge"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
